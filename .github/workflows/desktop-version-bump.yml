name: Desktop version bump PR

on:
  workflow_dispatch:
    inputs:
      increment:
        description: SemVer increment for the next stable desktop release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: desktop-version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Open version bump pull request
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require main as workflow source
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this workflow from main."
            exit 1
          fi
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked desktop tooling
        run: npm --prefix apps/desktop ci
      - name: Bump desktop version
        id: version
        shell: bash
        run: |
          version="$(node apps/desktop/scripts/bump-version.mjs '${{ inputs.increment }}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test release scripts
        run: npm --prefix apps/desktop test -- tests/release-scripts.test.ts tests/packaging.test.ts
      - name: Commit version branch
        id: branch
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch --no-tags origin "$branch:refs/remotes/origin/$branch"
            expected_files=$'apps/api/pyproject.toml\napps/api/src/bento/__init__.py\napps/api/src/bento/domain/settings_registry.py\napps/api/src/bento/infrastructure/settings.py\napps/api/uv.lock\napps/desktop/package-lock.json\napps/desktop/package.json'
            changed_files="$(git diff --name-only origin/main "origin/$branch")"
            if [ "$changed_files" != "$expected_files" ] || ! git diff --quiet "origin/$branch" -- $expected_files; then
              echo "Existing $branch is not the exact expected version-only change; refusing to overwrite it."
              exit 1
            fi
            echo "Reusing existing $branch with identical version metadata."
          else
            git switch -c "$branch"
            git add $expected_files
            git commit -m "Bump desktop version to v$VERSION"
            git push origin "$branch"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          existing_url="$(gh pr list --base main --head "$VERSION_BRANCH" --state open --json url --jq '.[0].url')"
          if [ -n "$existing_url" ]; then
            echo "Reusing open pull request: $existing_url"
          else
            gh pr create --base main --head "$VERSION_BRANCH" --title "Release desktop v$VERSION" --body "Bump Bento Desktop to v$VERSION. Merge only after the required pull-request native validation is green; create and push tag v$VERSION from the merged main commit afterwards."
          fi
      - name: Dispatch required native validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          # Events created by GITHUB_TOKEN do not recursively start pull_request workflows.
          # Dispatch the exact branch explicitly; desktop-native concurrency coalesces retries.
          gh workflow run desktop-native.yml --ref "$VERSION_BRANCH"
