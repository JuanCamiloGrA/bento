[project]
name = "bento-api"
version = "0.1.0"
description = "Bento local-first API and worker package."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<0.116",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<0.1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<9",
]
media = [
  "pillow>=11,<12",
  "pypdfium2>=4.30,<5",
]
ocr = [
  "rapidocr>=3,<4",
]
telegram = [
  "aiogram>=3,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bento"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
