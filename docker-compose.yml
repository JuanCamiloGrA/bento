services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: sh -c "cd /app/apps/api && alembic upgrade head && cd /app && python -m bento.interfaces.http.main"
    env_file:
      - .env.example
    environment:
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: python -m bento.interfaces.worker.main
    env_file:
      - .env.example
    environment:
      DATA_DIR: /app/data
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file:
      - .env.example
    environment:
      VITE_API_BASE_URL: "http://127.0.0.1:${API_PORT:-8000}/api"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    command: ["--local", "--http-port=8081"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    profiles:
      - telegram
    ports:
      - "127.0.0.1:${TELEGRAM_BOT_API_PORT:-8081}:8081"
    volumes:
      - ./data/cache/telegram-bot-api:/var/lib/telegram-bot-api
