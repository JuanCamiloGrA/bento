default_install_hook_types: [pre-commit, pre-push]

exclude: >-
  (?x)^(
    apps/api/\.venv/|
    apps/web/node_modules/|
    apps/web/dist/|
    data/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
        files: ^(apps/api|scripts)/.*\.py$
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: backend-tests
        name: Backend pytest
        entry: python scripts/pre_commit/run_backend_tests.py
        language: system
        pass_filenames: false
        files: ^(apps/api|scripts)/.*(\.py|\.toml|\.ini)$|^apps/api/uv\.lock$
        stages: [pre-push]

      - id: frontend-tests
        name: Frontend Vitest
        entry: npm --prefix apps/web test
        language: system
        pass_filenames: false
        files: ^apps/web/.*\.(ts|tsx|js|jsx|json|html|css)$
        stages: [pre-push]

      - id: frontend-build
        name: Frontend TypeScript and Vite build
        entry: npm --prefix apps/web run build
        language: system
        pass_filenames: false
        files: ^apps/web/.*\.(ts|tsx|js|jsx|json|html|css)$
        stages: [pre-push]
